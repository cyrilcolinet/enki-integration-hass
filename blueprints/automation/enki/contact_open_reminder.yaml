blueprint:
  name: Enki contact – open too long reminder
  description: >
    Notify when an Enki door/window contact sensor stays open longer than a set
    time — a fridge left ajar, a window forgotten before leaving, a garage door
    still up. Re-notifies each time it happens.
  domain: automation
  author: cyrilcolinet
  source_url: https://github.com/cyrilcolinet/enki-integration-hass/blob/main/blueprints/automation/enki/contact_open_reminder.yaml
  input:
    contact_sensor:
      name: Contact sensor
      description: The Enki door / window contact sensor.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: door
            - domain: binary_sensor
              device_class: window
            - domain: binary_sensor
              device_class: opening
            - domain: binary_sensor
              device_class: garage_door
    open_duration:
      name: Open for
      description: How long the sensor must stay open before notifying.
      default:
        minutes: 5
      selector:
        duration:
    notify_action:
      name: Notification action
      description: The notify action to call, e.g. notify.mobile_app_your_phone.
      default: notify.notify
      selector:
        text:

mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input contact_sensor
    to: "on"
    for: !input open_duration

actions:
  - action: !input notify_action
    data:
      title: Still open
      message: "{{ trigger.to_state.attributes.friendly_name }} has been open for a while."
