---
name: Bug report
description: Report a bug with the Enki integration
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, search [existing issues](https://github.com/cyrilcolinet/enki-integration-hass/issues).

        Device working in the Enki app but not here? Attach your diagnostics (Settings → Devices &
        services → Enki → your device → ⋮ → Download diagnostics). If that is not enough we may ask
        you to [show what the app sends](https://github.com/cyrilcolinet/enki-integration-hass/blob/main/docs/CAPTURE.md) —
        no development experience needed, and the page includes a prompt for an AI assistant to walk
        you through it.
  - type: input
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    attributes:
      label: Integration version
      description: Version shown in HACS or manifest.json
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe the issue
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Debug logs
      description: "Enable logger `enki: debug` in configuration.yaml"
      render: text
    validations:
      required: true
