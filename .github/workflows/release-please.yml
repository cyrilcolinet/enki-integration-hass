name: Release please

# Opens / updates the "chore: release X.Y.Z" PR (CHANGELOG + manifest.json).
# Manual merge → tag vX.Y.Z + GitHub Release (release-please) + enki.zip + install note.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish-release:
    name: publish-release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build HACS zip
        run: |
          cd "${{ github.workspace }}/custom_components/enki"
          zip -r enki.zip .

      # release-please writes the changelog from commit messages, which say nothing
      # about who sent them. GitHub works out first-time contributors from pull
      # request authors, so ask it and keep only that section. Someone who helped
      # through an issue rather than a PR will not be in it.
      - name: Compose the release footer
        id: footer
        uses: actions/github-script@v9
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              ...context.repo,
              tag_name: process.env.TAG,
            });
            const found = data.body.match(/## New Contributors\n([\s\S]*?)(?:\n\n|$)/);
            const thanks = found
              ? `## Thanks\n\nFirst contribution in this release:\n\n${found[1].trim()}\n\n`
              : '';
            core.setOutput(
              'body',
              `${thanks}## Install\n\nHACS → Enki → Update, then restart Home Assistant.\n`,
            );

      - name: Upload enki.zip and append the footer
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ github.workspace }}/custom_components/enki/enki.zip
          append_body: true
          body: ${{ steps.footer.outputs.body }}

  mark-released-issues:
    name: mark-released-issues
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Everything merged to main since the last release ships in this tag, so
      # swap "pending release" → "released" and note the version. Issues stay
      # OPEN on purpose — closing them is left to the maintainer.
      - uses: actions/github-script@v9
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'pending release',
              per_page: 100,
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: issue.number, name: 'pending release',
              }).catch(() => {});
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ['released'],
              });
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number, body: `Released in ${process.env.TAG}. 🎉`,
              });
              core.info(`#${issue.number} → released (${process.env.TAG})`);
            }
